title: Romance Books with Disability Representation
description: Curated romance titles featuring disabled protagonists.
url: https://athirawrites.github.io
baseurl: /site
remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  books:
    output: true
    permalink: /books/:slug/

defaults:
  - scope:
      path: ""
      type: "books"
    values:
      layout: single
      author_profile: false
      read_time: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false

# Minimal Mistakes options
search: false   # We'll provide our own client-side Lunr search